[metadata]
name = http-nbd-transfer
version = 1.7.0
description = Set of tools to transfer NBD requests to an HTTP server
author = Ronan Abhamon
author_email = ronan.abhamon@vates.tech
url = https://vates.tech
license = GPL-3.0-or-later

[options]
packages = find:
package_dir =
    =src
scripts =
    scripts/http-disk-server
    scripts/nbd-http-server
# TODO(XCPNG-3919): Change it for modern python.
python_requires = >=3.6

[options.packages.find]
where = src
