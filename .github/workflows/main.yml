name: Build and tests

on: [push, pull_request]

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get -y install nbdkit-plugin-dev libcurl4-openssl-dev

      - name: Build multi-http-plugin
        run: make

      - uses: actions/upload-artifact@v7
        with:
          name: multi-http-plugin
          path: nbdkit-multi-http-plugin.so
          if-no-files-found: error
          retention-days: 1

  tests:
    name: Tests
    runs-on: ubuntu-latest
    needs: build
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.8", "3.14"]

    steps:
      - uses: actions/checkout@v6

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get -y install nbd-client nbdkit lsof

      - uses: actions/download-artifact@v8
        with:
          name: multi-http-plugin

      - uses: ./.github/actions/setup-python-env
        with:
          python-version: ${{ matrix.python-version }}

      # Root is required to use NBD devices. It's why sudo is used and PATH set explicitly.
      - name: Tests
        run: uv run sh -c 'sudo env "PATH=$PATH" pytest -s -vv'
